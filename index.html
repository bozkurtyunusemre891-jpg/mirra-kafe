<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mırra Kafe | Premium Gurme Deneyimi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f11;
            --bg-card: #18181b;
            --accent: #c5a059;
            --accent-glow: rgba(197, 160, 89, 0.25);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 17, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            color: var(--accent);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            padding: 5px 0;
        }

        .nav-links button::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: var(--transition);
        }

        .nav-links button:hover::after,
        .nav-links button.active::after {
            width: 100%;
        }

        .nav-links button:hover,
        .nav-links button.active {
            color: var(--accent);
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 140px 6% 80px 6%;
            animation: fadeIn 0.6s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Bölümü */
        .hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            min-height: 75vh;
            gap: 60px;
        }

        .hero-content h1 {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .hero-content h1 span {
            color: var(--accent);
        }

        .hero-content p {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.7;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(197, 160, 89, 0.4);
            background: #d4af37;
        }

        .hero-image-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            height: 450px;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
            transition: var(--transition);
        }

        .hero-image-wrapper:hover img {
            transform: scale(1.03);
        }

        /* Menü Bölümü */
        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 600;
            transform: translateY(-2px);
        }

        .category-content {
            display: none;
        }

        .category-content.active {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            animation: fadeIn 0.5s ease forwards;
        }

        .menu-item {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .menu-item:hover {
            transform: translateY(-8px);
            border-color: rgba(197, 160, 89, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .item-img-container {
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .item-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .menu-item:hover .item-img-container img {
            transform: scale(1.08);
        }

        .item-details {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .item-title-price {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .item-title-price h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .item-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 18px;
        }

        .item-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Renkli ve Görsel Hakkımızda Alanı */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .about-card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            height: 380px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: var(--transition);
        }

        .about-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        .about-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
            transition: var(--transition);
        }

        .about-card:hover img {
            transform: scale(1.05);
            filter: brightness(0.75);
        }

        .about-overlay {
            position: relative;
            z-index: 2;
            padding: 35px;
            background: linear-gradient(to top, rgba(15,15,17,0.95) 20%, rgba(15,15,17,0.4) 80%, transparent);
        }

        .about-overlay i {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .about-overlay h3 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #fff;
        }

        .about-overlay p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Renkli ve Görsel İletişim Alanı */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .contact-card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            height: 380px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: var(--transition);
        }

        .contact-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        .contact-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
            transition: var(--transition);
        }

        .contact-card:hover img {
            transform: scale(1.05);
            filter: brightness(0.75);
        }

        .contact-overlay {
            position: relative;
            z-index: 2;
            padding: 35px;
            background: linear-gradient(to top, rgba(15,15,17,0.95) 20%, rgba(15,15,17,0.4) 80%, transparent);
        }

        .contact-overlay i {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .contact-overlay h3 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #fff;
        }

        .contact-overlay p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background: rgba(15, 15, 17, 0.95);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 40px 6%;
            margin-top: 100px;
        }

        footer p {
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                min-height: auto;
            }
            .hero-content h1 {
                font-size: 38px;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo" onclick="switchPage('home')">Mırra Kafe</div>
        <div class="nav-links">
            <button id="nav-home" class="active" onclick="switchPage('home')">Ana Sayfa</button>
            <button id="nav-menu" onclick="switchPage('menu')">Gurme Menü</button>
            <button id="nav-about" onclick="switchPage('about')">Hakkımızda</button>
            <button id="nav-contact" onclick="switchPage('contact')">İletişim</button>
        </div>
    </nav>

    <!-- Ana Sayfa -->
    <section id="home" class="page active">
        <div class="hero">
            <div class="hero-content">
                <h1>Geleneksel Lezzet, <span>Modern Den
